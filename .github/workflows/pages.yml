name: Deploy GitHub Pages

# PUBLISHING DISABLED - identity overhaul in progress.
#
# This workflow previously published ./docs from the gh-pages branch to GitHub
# Pages on every push to gh-pages. It no longer uploads or deploys anything.
# The job is retained (rather than the file deleted) so the intent is visible
# in the repository and the previous configuration can be restored
# deliberately. The pre-overhaul state is preserved on the
# `pre-overhaul-archive` branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: Publishing disabled
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to deploy
        run: |
          echo "::error::GitHub Pages publishing is disabled for this repository during the identity overhaul. No artifact was uploaded and no deployment occurred."
          exit 1
